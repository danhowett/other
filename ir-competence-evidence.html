<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>IR Competence Evidence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#F8F9FB;--surface3:#F1F4F8;--border:#E2E6EC;--border2:#D0D6DF;
  --text:#1A2130;--text2:#3A4658;--muted:#6B7A90;--faint:#B8C4D0;
  --accent:#1456CC;--accent-h:#0F48B0;--accent-soft:#EEF3FC;--accent-line:#C5D4F5;--on-accent:#FFFFFF;
  --ok:#0A7A50;--ok-soft:#DCFAEE;--ok-line:#A8D8BC;--warn:#9A5000;--warn-soft:#FFF5D6;--warn-line:#F5D580;--bad:#C0283A;--bad-soft:#FDEDF0;--bad-line:#F0A8B0;
  --sidebar-bg:#1C2333;--sidebar-text:#C8D4E8;--sidebar-muted:#7A8FA8;--sidebar-border:#2A3548;--sidebar-hover:#253047;--sidebar-active:#2D3A55;--sidebar-hi:#E8EEF8;--sidebar-accent:#4A90E2;
  --shadow:0 1px 3px rgba(0,0,0,.05);--overlay:rgba(0,0,0,.45);
}
[data-theme="dark"]{
  --bg:#0E131B;--surface:#151B25;--surface2:#1A212D;--surface3:#202938;--border:#263042;--border2:#344058;
  --text:#E4E9F2;--text2:#BAC5D6;--muted:#8796AE;--faint:#4B5871;
  --accent:#4C8DF6;--accent-h:#6AA0F8;--accent-soft:#17243A;--accent-line:#2B4674;--on-accent:#FFFFFF;
  --ok:#3DD68C;--ok-soft:#0F2A1F;--ok-line:#1F5A40;--warn:#F2B64C;--warn-soft:#2E2410;--warn-line:#6A4F18;--bad:#F2707F;--bad-soft:#321419;--bad-line:#6E2A34;
  --sidebar-bg:#0A0E15;--sidebar-text:#C8D4E8;--sidebar-muted:#6F819B;--sidebar-border:#1C2433;--sidebar-hover:#151C29;--sidebar-active:#1B2436;--sidebar-hi:#EEF3FA;--sidebar-accent:#4C8DF6;
  --shadow:0 1px 3px rgba(0,0,0,.35);--overlay:rgba(0,0,0,.6);
}
[data-theme="ocean"]{
  --bg:#EFF5F5;--surface:#FFFFFF;--surface2:#F5F9F9;--surface3:#EAF2F2;--border:#D9E5E5;--border2:#C3D5D5;
  --text:#152426;--text2:#334A4D;--muted:#5F7A7D;--faint:#AFC4C6;
  --accent:#0B7A75;--accent-h:#086460;--accent-soft:#E6F4F3;--accent-line:#A9D9D5;--on-accent:#FFFFFF;
  --ok:#0A7A50;--ok-soft:#DCFAEE;--ok-line:#A8D8BC;--warn:#9A5000;--warn-soft:#FFF5D6;--warn-line:#F5D580;--bad:#C0283A;--bad-soft:#FDEDF0;--bad-line:#F0A8B0;
  --sidebar-bg:#0F2A2C;--sidebar-text:#C6DEDD;--sidebar-muted:#7EA3A3;--sidebar-border:#1E3F41;--sidebar-hover:#16383A;--sidebar-active:#1C4447;--sidebar-hi:#EAF6F5;--sidebar-accent:#3CC2BA;
  --shadow:0 1px 3px rgba(0,0,0,.05);--overlay:rgba(0,0,0,.45);
}
[data-theme="contrast"]{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F4F4;--surface3:#EAEAEA;--border:#6E6E6E;--border2:#3C3C3C;
  --text:#000000;--text2:#111111;--muted:#2E2E2E;--faint:#6E6E6E;
  --accent:#0033A0;--accent-h:#00226E;--accent-soft:#E3EAFB;--accent-line:#0033A0;--on-accent:#FFFFFF;
  --ok:#005A32;--ok-soft:#D8F5E6;--ok-line:#005A32;--warn:#6B3500;--warn-soft:#FFF0C8;--warn-line:#6B3500;--bad:#9E0018;--bad-soft:#FDE2E6;--bad-line:#9E0018;
  --sidebar-bg:#000000;--sidebar-text:#FFFFFF;--sidebar-muted:#D0D0D0;--sidebar-border:#555555;--sidebar-hover:#222222;--sidebar-active:#333333;--sidebar-hi:#FFFFFF;--sidebar-accent:#FFD400;
  --shadow:none;--overlay:rgba(0,0,0,.7);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.mono{font-family:'SF Mono',Consolas,'Liberation Mono',monospace}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;min-width:236px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* SIDEBAR */
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--sidebar-border)}
.logo-badge{display:inline-block;background:var(--sidebar-accent);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1.2px;margin-bottom:8px}
[data-theme="contrast"] .logo-badge{color:#000}
.logo-title{font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--sidebar-hi)}
.logo-sub{font-size:10.5px;color:var(--sidebar-muted);margin-top:3px;line-height:1.4}
.sidebar-setup{padding:12px 16px;border-bottom:1px solid var(--sidebar-border)}
.sidebar-progress{padding:12px 16px;border-bottom:1px solid var(--sidebar-border)}
.prog-label{font-size:10.5px;color:var(--sidebar-muted);margin-bottom:6px;display:flex;justify-content:space-between}
.prog-bar{height:3px;background:var(--sidebar-border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--sidebar-accent);border-radius:2px;transition:width .4s}
.prog-warn{font-size:10px;color:#F0A8B0;margin-top:7px;line-height:1.4}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-section{font-size:9.5px;color:var(--sidebar-muted);letter-spacing:1.2px;padding:12px 16px 4px;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;font-size:12px;color:var(--sidebar-muted);border-left:2px solid transparent;user-select:none;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left}
.nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
.nav-item.active{background:var(--sidebar-active);color:var(--sidebar-hi);border-left-color:var(--sidebar-accent)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-lvl{font-family:'SF Mono',Consolas,monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--sidebar-border);color:var(--sidebar-text);flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--sidebar-border);display:flex;flex-direction:column;gap:8px}
.footer-group{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--sidebar-border);border-radius:8px}
.footer-label{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--sidebar-muted);padding:0 2px 2px}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--sidebar-border);background:transparent;color:var(--sidebar-muted);font-size:11px;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.btn:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);text-align:center;font-weight:600;padding:9px 12px;font-size:12px}
.btn-primary:hover{background:var(--accent-h);color:var(--on-accent)}
.btn-save{border-color:#2A7A55;color:#8FE6BC}
.btn-save:hover{background:rgba(42,122,85,.18);color:#B8F0D4}
.btn-reset{color:#C98A94;border-color:transparent;font-size:10.5px;opacity:.8}
.btn-reset:hover{background:rgba(192,40,58,.12);color:#E0A8B0;opacity:1}
.btn-row{display:flex;gap:6px}
.btn-half{flex:1;text-align:center}

/* TOPBAR */
.topbar{height:48px;min-height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.topbar-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-meta{font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-shrink:0}
.tb-action{font-size:11px;font-weight:600;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;cursor:pointer}
.tb-action:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tb-help{width:26px;height:26px;padding:0;border-radius:50%;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.tb-select{width:auto;max-width:150px;font-size:11px;font-weight:600;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 8px;cursor:pointer}
.fw-chip{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;padding:3px 9px;border:1px solid var(--border2);border-radius:20px;user-select:none;white-space:nowrap;background:none}
.save-status:hover{background:var(--surface2);border-color:var(--accent)}
.ss-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
.ss-dot.ok{background:#0A9A60}
.ss-dot.warn{background:#C0283A}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1C2333;color:#E8EEF8;font-size:12px;padding:11px 18px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:2000;opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;display:flex;align-items:center;gap:9px;max-width:min(560px,88vw);line-height:1.5}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#5C1620}
.toast-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;flex-shrink:0}
.toast.err .toast-dot{background:#F0A8B0}

/* GENERIC */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel-head{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);color:var(--text)}
.panel-head .sub{font-weight:400;color:var(--muted);font-size:11px}
.panel-body{padding:14px 16px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px}
.page-head h2{font-size:18px;font-weight:700;color:var(--text)}
.page-head p{font-size:12px;color:var(--muted);max-width:700px;line-height:1.65;margin-top:4px}
.big-num{font-family:'SF Mono',Consolas,monospace;font-size:28px;font-weight:700;line-height:1}
.small-muted{font-size:10.5px;color:var(--muted)}
.notice{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:10px 14px;font-size:11.5px;color:var(--text2);margin-bottom:14px;line-height:1.7}
.notice strong{color:var(--text)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}

/* LEVEL PILLS */
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;font-family:'SF Mono',Consolas,monospace;font-size:11px;font-weight:700;color:#fff}
.lv.na{background:var(--surface3);color:var(--muted);border:1px solid var(--border2)}
.lv.ns{background:transparent;color:var(--muted);border:1px dashed var(--border2)}
.lv.un{background:transparent;color:var(--faint);border:1.5px solid var(--border2)}
.chip{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.2px;white-space:nowrap;border:1px solid transparent}
.chip-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.chip-muted{background:var(--surface3);color:var(--muted);border-color:var(--border2)}
.chip-acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.chip-ir{background:#FFF1E6;color:#9A3A00;border-color:#F5C088}
[data-theme="dark"] .chip-ir{background:#2E1C10;color:#F7A865;border-color:#6A3F18}
.prio-Critical{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.prio-High{background:#FFF0E0;color:#9A3A00;border-color:#F5C088}
[data-theme="dark"] .prio-High{background:#2E1C10;color:#F7A865;border-color:#6A3F18}
.prio-Medium{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.prio-Low{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}

/* GUIDANCE */
.guide{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.guide-head{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;width:100%;background:none;border:none;text-align:left;color:var(--text)}
.guide-head:hover{background:var(--surface3)}
.guide-tag{font-size:9px;font-weight:700;letter-spacing:1px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);padding:3px 7px;border-radius:4px}
.guide-title{font-size:12.5px;font-weight:600;flex:1}
.guide-body{padding:4px 16px 16px;font-size:12px;color:var(--text2);line-height:1.7}
.guide-body p{margin-bottom:10px}
.scale-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 12px}
.scale-table td,.scale-table th{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}
.scale-table th{font-size:10.5px;color:var(--muted);font-weight:600;background:var(--surface2)}
.chevron{color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0;display:inline-block}
.chevron.open{transform:rotate(90deg)}

/* MODALS */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:999;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:24px;width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);color:var(--text)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:10px}
.modal-sec{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:20px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field-grid .full{grid-column:1 / -1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.hint{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.mbn{padding:7px 16px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer}
.mbn:hover{background:var(--surface3);color:var(--text)}
.mbp{padding:7px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:12px;cursor:pointer;font-weight:600}
.mbp:hover{background:var(--accent-h)}
.fw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fw-opt{border:1.5px solid var(--border2);border-radius:9px;padding:11px 13px;cursor:pointer;background:var(--surface);text-align:left;color:var(--text)}
.fw-opt:hover{border-color:var(--accent)}
.fw-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.fw-opt b{display:block;font-size:12.5px}
.fw-opt span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.custom-row{display:grid;grid-template-columns:70px 1fr 1.3fr 110px 130px 30px;gap:6px;margin-bottom:6px;align-items:center}
.custom-row input{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px;width:100%}
.custom-row label{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.help-list{margin:0 0 4px;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--text)}
.help-list li{margin-bottom:6px}
.help-callout{display:flex;gap:12px;background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:9px;padding:12px 14px;margin:12px 0;font-size:12.5px;line-height:1.6}
.pal-row{display:flex;gap:8px;flex-wrap:wrap}
.pal{border:1.5px solid var(--border2);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:11.5px;background:var(--surface);color:var(--text)}
.pal.on{border-color:var(--accent);background:var(--accent-soft)}
.pal i{display:inline-block;width:14px;height:14px;border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .18s ease}
@media (prefers-reduced-motion:reduce){.fu{animation:none}.prog-fill,.chevron,.toast{transition:none}}
@media (max-width:900px){.summary,.two-col{grid-template-columns:1fr}.hm{grid-template-columns:1fr}.aid-grid{grid-template-columns:1fr 1fr}.sidebar{width:200px;min-width:200px}}


/* ═══════════ IR COMPETENCE EVIDENCE ═══════════ */
body{padding-bottom:env(safe-area-inset-bottom,0px)}
.lv.pra{background:#5B6B82}.lv.pri{background:var(--accent)}.lv.ch{background:#C2410C}
[data-theme="dark"] .lv.ch{background:#D9631F}
.setup-name{font-size:13px;font-weight:600;color:var(--sidebar-hi);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-meta{font-size:11px;color:var(--sidebar-muted);display:flex;align-items:center;gap:7px;margin-bottom:9px}
.prog-block+.prog-block{margin-top:10px}
.prog-bar{position:relative}
.prog-mark{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--sidebar-hi);opacity:.55}
.prog-fill.ok{background:#3DD68C}
.nav-item .nav-lvl{font-size:9.5px}
.nav-id{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--sidebar-text);width:12px;flex-shrink:0}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.summary .panel{margin:0}
.stat-l{font-size:11px;color:var(--muted);margin-bottom:8px}
.stat-s{font-size:11px;color:var(--muted);margin-top:7px}
.big-num small{font-size:14px;color:var(--muted);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two-col .panel{margin-bottom:16px}
.ready{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:11px 14px;font-size:12px;line-height:1.65;margin-bottom:16px;border:1px solid}
.ready.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--text)}
.ready.go{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text2)}
.ready ul{margin:4px 0 0 18px}
.ready-ico{font-size:15px;line-height:1.3}

/* competence bars */
.cbar{display:grid;grid-template-columns:18px minmax(120px,230px) 1fr 52px;align-items:center;gap:12px;width:100%;background:none;border:none;border-radius:6px;padding:8px 6px;cursor:pointer;color:var(--text);text-align:left;font:inherit}
.cbar:hover{background:var(--surface3)}
.cbar-id{font-family:'SF Mono',Consolas,monospace;font-weight:700;font-size:12px}
.cbar-name{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:12px;border-radius:4px;background:var(--surface3);display:flex;overflow:visible}
.track i{display:block;height:100%}
.track i:first-child{border-radius:4px 0 0 4px}
.seg-t{background:var(--ok)}.seg-a{background:var(--warn-line)}.seg-g{background:var(--bad)}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.cbar-num{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--muted);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-none{background:var(--surface3);border:1px solid var(--border2)}
.lg-noev{background:transparent;border:1.5px dashed var(--border2)}
.lg-mark{width:2px!important;height:12px!important;background:var(--text);opacity:.55;border-radius:1px!important}

/* coverage map */
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 22px}
.hm-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.hm-lbl{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--muted);width:24px;flex-shrink:0}
.hm-cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:26px;height:26px;border-radius:5px;border:1px solid transparent;font-family:'SF Mono',Consolas,monospace;font-size:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text2)}
.cell:hover{outline:2px solid var(--accent);outline-offset:1px}
.cell.r-none{background:var(--surface3);border-color:var(--border2);color:var(--muted)}
.cell.r-gap{background:var(--bad);color:#fff}
.cell.r-acceptable{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.cell.r-thorough{background:var(--ok);color:#fff}
[data-theme="dark"] .cell.r-thorough,[data-theme="dark"] .cell.r-gap{color:#0E131B}
.cell.noev{border:1.5px dashed var(--border2)}
.cell.r-gap.noev,.cell.r-thorough.noev{border-color:var(--text)}

/* simple bars */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 28px;gap:10px;align-items:center;font-size:11.5px;padding:4px 0;color:var(--text2)}
.hbar .track{height:8px}
.hbar .track i{background:var(--accent);border-radius:4px}
.hbar b{font-family:'SF Mono',Consolas,monospace;font-size:11px;text-align:right;color:var(--muted)}

/* list rows (outstanding / next up) */
.orow{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:none;border-top:1px solid var(--border);padding:9px 16px;text-align:left;cursor:pointer;color:var(--text);font:inherit}
.orow:first-child{border-top:none}
.orow:hover{background:var(--surface3)}
.ocode{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--muted);width:62px;flex-shrink:0;padding-top:1px}
.otext{flex:1;font-size:12px;line-height:1.55;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ochips{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:180px}

/* competence page */
.row-panel .panel-head b{font-family:'SF Mono',Consolas,monospace;margin-right:8px}
.lvl-head{display:flex;align-items:center;gap:8px;padding:9px 16px 5px;font-size:11px;font-weight:600;color:var(--muted);border-top:1px solid var(--border)}
.stmt{border-top:1px solid var(--border)}
.lvl-head+.stmt{border-top:none}
.stmt-top{display:flex;align-items:flex-start;gap:12px;padding:11px 16px}
.stmt-toggle{flex:1;display:flex;gap:10px;align-items:flex-start;background:none;border:none;text-align:left;cursor:pointer;color:var(--text);font:inherit;padding:0;min-width:0}
.stmt-toggle .chevron{margin-top:3px}
.scode{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--muted);width:56px;flex-shrink:0;padding-top:2px}
.stext{font-size:12.5px;line-height:1.6;color:var(--text);max-width:80ch}
.stmt-side{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:10.5px;font-weight:600;padding:4px 9px;background:transparent;border:none;border-right:1px solid var(--border2);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface3);color:var(--text)}
.seg button.on.gap{background:var(--bad-soft);color:var(--bad)}
.seg button.on.acceptable{background:var(--warn-soft);color:var(--warn)}
.seg button.on.thorough{background:var(--ok-soft);color:var(--ok)}
.seg button.on.all{background:var(--accent-soft);color:var(--accent)}
.stmt-body{padding:2px 16px 16px 82px}
.ev-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ev-row{display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px}
.ev-main{flex:1;min-width:0}
.ev-title{font-size:12.5px;font-weight:600;color:var(--text)}
.ev-ref{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;color:var(--muted);margin-right:6px;font-weight:700}
.ev-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev-act{display:flex;gap:5px;flex-shrink:0}
.mini{font:inherit;font-size:10.5px;color:var(--muted);background:none;border:1px solid var(--border2);border-radius:5px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--text);border-color:var(--accent)}
.mini.danger:hover{color:var(--bad);border-color:var(--bad-line)}
.act-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stmt-body .field{margin-bottom:0}
.stmt-body .field textarea{font-size:12.5px;background:var(--surface)}
.no-ev{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.cmp-toggle{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface2);border:none;border-top:1px solid var(--border);padding:8px 16px;font:inherit;font-size:11px;color:var(--muted);cursor:pointer;text-align:left}
.cmp-toggle:hover{color:var(--text);background:var(--surface3)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border);background:var(--surface2)}
.cmp>div{padding:12px 16px;border-right:1px solid var(--border)}
.cmp>div:last-child{border-right:none}
.cmp h4{font-size:11px;font-weight:600;color:var(--text2);display:flex;gap:7px;align-items:center;margin-bottom:8px}
.cmp ul{margin-left:16px;font-size:11.5px;line-height:1.6;color:var(--text2)}
.cmp li{margin-bottom:6px}
.cmp .none{font-size:11.5px;color:var(--muted)}

/* library */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:7px 11px;color:var(--text);font-size:12.5px;outline:none}
.toolbar input{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.ecard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ecard.unsan{border-left-color:var(--warn-line)}
.ecard-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.ecard-h .ev-title{flex:1;font-size:13.5px}
.ecard p{font-size:12px;color:var(--text2);line-height:1.65;margin-top:6px;max-width:90ch;white-space:pre-wrap}
.ecard p b{color:var(--text);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.lchip{font-family:'SF Mono',Consolas,monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.lchip:hover{border-color:var(--accent)}
.lchip.out{background:var(--surface3);color:var(--muted);border-color:var(--border2)}

/* dialogs */
.modal.wide{width:1080px;max-width:96vw;max-height:94vh}
.modal .modal-actions.sticky{position:sticky;bottom:-24px;margin:20px -24px -24px;padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);border-radius:0 0 12px 12px;align-items:center;z-index:2}
.modal-actions .draft-state{margin-right:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.guard{display:none;margin-right:auto;align-items:center;gap:8px;font-size:12px;color:var(--warn);font-weight:600}
.modal-actions.guarding .guard{display:flex}.modal-actions.guarding .draft-state{display:none}
.draft-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2);margin-bottom:14px}
.ev-cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.ev-cols .picker{max-height:none;height:calc(94vh - 330px);min-height:260px}
.ev-cols .field textarea{min-height:84px}
@media (max-width:900px){.ev-cols{grid-template-columns:1fr}.ev-cols .picker{height:300px}}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--text2);line-height:1.5;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.picker{border:1px solid var(--border2);border-radius:8px;max-height:260px;overflow-y:auto;background:var(--bg)}
.pick-grp{font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 10px 3px;position:sticky;top:0;background:var(--bg)}
.pick{display:flex;gap:9px;align-items:flex-start;padding:5px 10px;cursor:pointer;font-size:11.5px;line-height:1.45;color:var(--text2)}
.pick:hover{background:var(--surface3)}
.pick input{margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.pick .scode{width:52px}
.pick span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick-n{font-size:10.5px;color:var(--muted);margin-top:5px}
.err-hint{color:var(--bad)}
.lx-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}
.lx-row:first-child{border-top:none}
.fw-grid.three{grid-template-columns:repeat(3,1fr)}
.fw-opt .lv{margin-bottom:6px}

@media (max-width:1000px){.summary{grid-template-columns:1fr 1fr}.cmp{grid-template-columns:1fr}.cmp>div{border-right:none;border-bottom:1px solid var(--border)}}
@media (max-width:760px){
  html,body{height:auto}
  #app{flex-direction:column;height:auto;overflow:visible}
  .sidebar{width:100%;min-width:0}
  .sidebar-nav{max-height:240px}
  .main,.content{overflow:visible}
  .topbar{height:auto;padding:10px 14px;flex-wrap:wrap}
  .topbar-meta{flex-wrap:wrap}
  .content{padding:16px}
  .summary,.two-col,.fw-grid.three,.field-grid{grid-template-columns:1fr}
  .stmt-top{flex-direction:column}
  .stmt-body{padding-left:16px}
  .cbar{grid-template-columns:18px 1fr 52px}.cbar-name{display:none}
}

/* ═══ v2: application sections ═══ */
.desc{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.6;color:var(--text2);margin-bottom:6px;max-width:90ch}
.desc .lv{flex-shrink:0;margin-top:1px}.desc.cur{color:var(--text);font-weight:500}
.lnk{font:inherit;font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:.15em;margin:0 0 12px}
.src-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--surface);border:1px solid var(--accent-line);border-radius:6px;padding:2px 4px 2px 8px;color:var(--text)}
.src-b{font:inherit;font-size:11px;background:none;border:none;color:var(--muted);cursor:pointer;padding:1px 4px;border-radius:4px}.src-b:hover{color:var(--accent);background:var(--accent-soft)}
.src-add{font:inherit;font-size:11.5px;background:var(--surface);border:1px dashed var(--border2);border-radius:6px;padding:3px 6px;color:var(--muted);max-width:280px}
.field.star{margin-bottom:12px}.field.star label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}.field.star .hint{margin:0 0 5px}
.field.star textarea{font-size:13px;line-height:1.6;background:var(--surface)}
.sc-foot{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-top:4px}.sc-foot>div{flex:1;min-width:260px}
.cklist{list-style:none;display:flex;flex-direction:column;gap:5px}.cklist li{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:var(--text2)}.cklist .chip{flex-shrink:0;min-width:58px;text-align:center}
.ctx-toggle{border-top:1px solid var(--border);font-weight:600;color:var(--text2)}
.ctx-h{background:var(--surface2);gap:8px;color:var(--text2)}.ctx-h .mono{font-size:10.5px}
.also{font-size:11px;color:var(--muted);padding:9px 16px;border-top:1px solid var(--border)}
.seg-n{background:var(--border2)}.track .mark.mx{background:var(--bad);opacity:.5}
.sbar{padding:6px}
.facts{margin-left:16px;font-size:12px;line-height:1.6;color:var(--text2)}.facts li{margin-bottom:6px}
.mini-table{width:100%;border-collapse:collapse;font-size:11.5px}.mini-table th{font-size:10.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border)}.mini-table td{padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text2)}.mini-table td:nth-child(n+2),.mini-table th:nth-child(n+2){text-align:right;width:70px;font-family:'SF Mono',Consolas,monospace}
.dl{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px}.dl dt{color:var(--muted)}.dl dd{color:var(--text)}
.sup-wrap{overflow-x:auto}.sup{width:100%;border-collapse:collapse;min-width:640px}.sup th{font-size:10.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 4px 6px}
.sup td{padding:3px 4px}.sup input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px}.sup input:focus{border-color:var(--accent);outline:none}
.lchip.sec{border-color:#C2410C;color:#C2410C;background:transparent}
[data-theme="dark"] .lchip.sec{border-color:#F7A865;color:#F7A865}
.links .small-muted{margin-right:4px;min-width:62px}
.sidebar{overflow-y:auto}
.sidebar-nav{flex:none;overflow:visible}
.sidebar-footer{margin-top:auto}
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" aria-label="Competence evidence navigation">
    <div class="sidebar-logo">
      <div class="logo-badge" style="background:#C2410C">SPCC</div>
      <div class="logo-title">IR Competence Evidence</div>
      <div class="logo-sub">UKCSC SPCC v4.2 · Incident Response<br>Runs offline; nothing is uploaded</div>
    </div>
    <div class="sidebar-setup" id="side-setup"></div>
    <div class="sidebar-progress" id="side-progress"></div>
    <div class="sidebar-nav" id="side-nav"></div>
    <div class="sidebar-footer">
      <div class="footer-group">
        <div class="footer-label">Progress file</div>
        <button class="btn btn-save" onclick="exportJSON()">⤓ Save progress (.json)</button>
        <button class="btn" onclick="pickFile()">⤒ Load progress (.json)</button>
        <button class="btn" onclick="loadSample()">◇ Load worked example</button>
      </div>
      <div class="footer-group">
        <div class="footer-label">Export</div>
        <button class="btn btn-save" onclick="exportApplication()">⤓ Application draft (.html)</button>
        <div class="btn-row"><button class="btn btn-half" onclick="exportPrep()">Interview pack</button><button class="btn btn-half" onclick="exportCSV()">Table .csv</button></div>
      </div>
      <button class="btn btn-reset" onclick="resetAll()">✕ Clear all data</button>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-meta">
        <span id="topbar-sub"></span>
        <span class="fw-chip" id="store-chip"></span>
        <button class="save-status" id="save-status" onclick="exportJSON()" title="Save progress to a .json file"></button>
        <select class="tb-select" id="theme-select" onchange="setTheme(this.value)" aria-label="Colour theme" title="Colour theme">
          <option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option><option value="ocean">≈ Ocean</option><option value="contrast">◼ High contrast</option>
        </select>
        <button class="tb-action tb-help" onclick="openHelp()" aria-label="Help" title="Help">?</button>
      </div>
    </div>
    <main class="content" id="content"><div class="wrap" id="view"></div></main>
  </div>
</div>

<div class="overlay" id="dlg" style="display:none">
  <div class="modal" id="dlg-box" role="dialog" aria-modal="true"></div>
</div>
<input type="file" id="file-in" accept=".json,application/json" style="display:none" onchange="loadFile(this)">

<script>
// ── Source: UK Cyber Security Council SPCC, Incident Response contextualisation (v2) ──
// Row topic labels are this tool's own navigation aids; statement text is from the standard.
// Where the source repeats a bullet verbatim within or across rows it is included once.
const COMP = [
 { id:'A', title:'Knowledge, understanding & experience', rows:[
  { id:'A1', topic:'Technical knowledge and experience',
   pra:["Demonstrates solid understanding of incident response roles, concepts, techniques and procedures, with growing technical knowledge across key areas and ability to apply this knowledge in routine scenarios.",
        "Has hands-on experience handling routine incidents under limited supervision, can effectively follow incident playbooks and procedures, and contribute meaningfully to incident response activities across most phases of the incident lifecycle.",
        "Demonstrates awareness of related technical disciplines and their relevance to incident response, with ability to communicate requirements to specialists and understand their input under guidance."],
   pri:["Possess a broad technical understanding of the relevant subject matter and what the different areas involve.",
        "Has ability to draw on knowledge and personal professional experience to input into the incident action plan, associated incident playbooks and can execute them with minimum direction.",
        "Understands the core technical concepts related to the discipline and apply them appropriately with minimal guidance."],
   ch:["Has a deep subject matter knowledge across key incident response specialist areas and can demonstrate understanding of the technical and procedural concepts, and their application.",
       "Has real-world experience of incident management, either as an incident response team leader or an area specialist with a strong track record of managing incidents ranging from simple to complex, with responsibility for the full incident lifecycle, up to and including final sign off and liaison with the entity under investigation.",
       "Although they may not be specialist across every specialist area, they can understand the complementary parallel disciplines (to incident response), liaise with those team specialists and delegate taskings to them and review outputs from those teams with a high degree of competency and confidence."]},
  { id:'A2', topic:'Applying knowledge to incidents',
   pra:["Can recognise common incident types and patterns and apply incident response procedures to familiar scenarios with limited supervision, seeking guidance for new or more complex situations.",
        "Can gather relevant information about incidents and propose potential courses of action under supervision, understanding the importance of objectivity in incident handling.",
        "Can handle routine aspects of incident investigation under guidance, recognise common challenges, and understand when to escalate issues beyond their experience level, while maintaining awareness of customer and regulatory constraints."],
   pri:["Understands the elements of a cyber incident and can apply the principles of incident management to undertake relevant courses of action to deliver the desired outcome.",
        "Can provide guidance to an organisation on different solutions to a problem, whilst being independent and objective for the considerations for the situation.",
        "Has the subject matter knowledge to resolve challenges faced before them and adequate experience to seek advice from colleagues or a team manager when required."],
   ch:["They can apply their knowledge and experience to new/unknown incident response situations and can apply their knowledge and the methodologies to tackle those situations with no difficulty.",
       "Can take input from the customer and team members and apply their own knowledge and experience to formulate the plan and direction of an incident investigation.",
       "Can both direct and execute the incident investigation, deal with unforeseen challenges, problems and customer inputs/constraints, whilst operating within the constraints of customer and regulatory/legal requirement."]},
  { id:'A3', topic:'Remediation and improvement',
   pra:["Can assist in implementing defined remediation actions and contribute to discussions about process improvements, with a developing understanding of how incident response activities connect to broader security objectives.",
        "Can support in the development or implementation of improvement plans, using these to contribute updates to incident playbooks based on experiences, with an understanding of organisational constraints and stakeholder needs. Able to provide relevant input when asked during the review of incident action plans."],
   pri:["Understands the direction and required outcomes of the situation and can input into and execute tasks to enable the overall objectives to improving cyber security.",
        "Can input into the creation of a cyber security improvement plan and can assist the organisation to achieve it. Has the experience and skills to feed into, update and create an incident action plan and associated incident playbooks."],
   ch:["Has real-world experience of implementation of remediation actions and improvements both to the incident management processes and more widely to cyber security.",
       "Can manage customer and team expectations and stakeholder input whilst preparing and executing improvement plans for cyber security and work within the real-world situational constraints and limitations to get the best course of action for improving cyber security under the circumstances.",
       "Can provide remedial and strategic advice to fill any located gaps in process, procedures and technology."]}
 ]},
 { id:'B', title:'Communications & interpersonal skills', rows:[
  { id:'B1', topic:'Stakeholder communication and challenge',
   pra:["Can communicate routine incident response briefs, updates and actions clearly to immediate team members and stakeholders, adapting technical terminology when needed, and recognise when complex matters need to be escalated to more experienced colleagues.",
        "Can raise questions about potential issues in a constructive manner when confident in their position, and receptive to feedback and guidance from others. Able to explain incident implications using straightforward examples."],
   pri:["Presents feedback, plans, updates and recommendations to the organisation in a non-technical manner, using language appropriate to the audience.",

  "scenarios": {
    "A1": {
      "situation": "A mid-sized UK manufacturer called us on a Saturday after ransomware encrypted most of its Windows estate, including the systems that schedule production. The organisation had no in-house security team, its backups were partly online, and the operations director needed production running within days to meet contractual deliveries. The insurer's breach coach and the client's external lawyers were already engaged, so the response had to work within their requirements from the first hour.",
      "task": "I was the incident lead, accountable for the response from scoping to final sign-off. I directed a team of six: two host forensic analysts, a network analyst, a malware reverse engineer, a cloud specialist and a junior analyst responsible for evidence handling. The client's IT director owned operational decisions and the managing director owned business risk. Decisions on ransom payment and regulatory notification sat with the client and its lawyers; my role was to give them the evidence to decide.",
      "action": "Within four hours I agreed the scope under legal privilege and issued an incident action plan with three priorities: establish the initial access route, preserve evidence before rebuilding, and confirm whether data had left the network. I set twice-daily briefings and kept a decision log that separated confirmed findings from hypotheses. When the early team view pointed to phishing, I challenged it because the virtual private network (VPN) appliance logs showed exploitation of an unpatched edge device, and I directed targeted analysis that confirmed the appliance route. Faced with evidence of persistence across the domain, I recommended rebuilding the identity tier rather than cleaning it in place. The operations director pushed for faster restoration, so I set out both options with their re-compromise risk and the managing director chose the staged rebuild. I reviewed every specialist output before it went to the client, and gave the lawyers and the data protection officer (DPO) an evidence-based view on data exfiltration within the 72-hour notification window.",
      "result": "Production resumed after five working days from offline backups, with no ransom paid, and four weeks of enhanced monitoring confirmed no re-infection. The client's lawyers made a documented notification decision based on our exfiltration findings. I signed off a final report with 14 prioritised remediation actions, each with a named owner.",
      "followup": "At the 90-day review I confirmed with the IT director that 11 of the 14 actions were complete, including multi-factor authentication on remote access and patching of internet-facing devices, and we agreed dates for the remaining three. The decision log format from this case is now standard across my team.",
      "sources": [
        "ev-sample-001"
      ]
    },
    "A2": {
      "situation": "A 400-person professional services firm reported a business email compromise (BEC). The firm had already reset the affected user's password, but suspicious mailbox activity continued. The firm held client-confidential legal and financial material, so it needed to know quickly which client matters had been exposed. None of our existing playbooks covered persistence that survives a password reset in Microsoft 365.",
      "task": "I led the investigation and owned the technical approach. A cloud specialist on my team ran log queries under my direction, and the firm's IT manager made all changes to the tenant. Decisions on notifying the firm's own clients sat with its general counsel.",
      "action": "I treated the failed password reset as the key clue and worked through what could survive it: OAuth (open authorisation) application consents, service principal credentials, refresh tokens and mailbox rules. I asked the cloud specialist to export every application consent and service principal credential and compare them against a known-clean tenant baseline, while I analysed the unified audit log and Entra ID sign-in logs myself. This identified a malicious application with tenant-wide consent and an added credential on a legitimate service principal. I compared the activity with published threat intelligence on actors abusing OAuth in Microsoft 365, which suggested the attacker would next target additional mailboxes, and I prioritised checking those. I then designed an eviction sequence that revoked the application, the service principal credential and all refresh tokens together, so the attacker could not detect a partial response and re-establish access. My update to general counsel separated confirmed facts from assessment, including what the logs could not show.",
      "result": "The IT manager carried out the eviction within 36 hours of our engagement, and two weeks of follow-up monitoring showed no further access from the malicious application or related sign-ins. I confirmed that documents in three client matters had been accessed, which gave general counsel a defensible basis for notifying those clients and not others.",
      "followup": "I wrote the method up as a cloud persistence playbook, which my team has since used on two further cases. I also gave the firm a hardening plan covering application consent and conditional access; at a follow-up call the IT manager confirmed that user consent to third-party applications is now disabled.",
      "sources": [
        "ev-sample-002"
      ]
    },
    "A3": {
      "situation": "A lessons-learnt review across my incident response team found that evidence handling and decision recording varied between engagements. Two cases were heading towards litigation, and inconsistent records would have weakened our evidence. The team handles around 60 incidents a year across ransomware, business email compromise, insider and cloud cases.",
      "task": "I was accountable for designing and delivering the improvement, under objectives agreed with our head of incident response services. I delegated drafting of individual playbooks to the senior consultants with the most experience of each incident type, worked with our legal adviser on evidence and privilege, and the head of service kept final approval of the playbook suite.",
      "action": "I reviewed records from a sample of recent engagements to find where practice diverged, then set minimum standards that every playbook had to meet: a decision log, evidence handling aligned to ISO/IEC 27037, and defined escalation points. Delivery leads wanted shorter playbooks; I agreed to a short core checklist with detailed annexes, but kept the evidence and decision steps mandatory. I reviewed every draft against the standards and ran two walkthroughs using past cases to test whether the playbooks worked under time pressure. The ransomware walkthrough showed the containment decision came too late, so I moved it earlier. I briefed the whole team on the changes and paired junior analysts with seniors on their first engagements under the new playbooks.",
      "result": "The head of service approved the suite and it became mandatory from March 2024. In both cases that went to litigation, the opposing experts did not challenge our evidence handling. Across the following ten engagements, the time to produce an initial incident action plan fell from about a working day to around half a day, measured from our case records.",
      "followup": "I set a six-monthly review cycle. At the first review I sampled five case files and found that all contained a decision log, but two had incomplete evidence continuity records. I added a check to our case closure step, and the next sample showed complete records. Actions from our monthly threat briefing now feed into the playbooks between reviews.",
      "sources": [
        "ev-sample-004"
      ]
    },
    "B1": {
      "situation": "A national retailer's executive committee asked us to run a ransomware crisis exercise after a competitor suffered a major outage. The committee included the chief executive, chief financial officer, general counsel and head of communications. Several members had strong, untested views about how they would respond, and the exercise needed to expose those assumptions without becoming a lecture.",
      "task": "I designed and facilitated the three-hour exercise and was responsible for the post-exercise report and recommendations. The committee owned its decisions and its crisis plan; my role was to test them, not to make them.",
      "action": "Before the exercise I interviewed four committee members separately to understand their concerns and the decisions they expected to face, and built the scenario around those. During the session I used open questions to draw out reasoning, for example asking the chief financial officer what he expected to receive in return for a ransom payment. When he argued that paying would be the fastest route back to trading, I listened to his reasoning about lost sales, acknowledged it, then summarised the evidence on decryptor reliability, sanctions risk and insurer requirements in plain terms. A disagreement developed between the IT director and the head of communications over when to inform customers. I paused the exercise, summarised both positions back to them, and reframed it as the decision the committee needed to make and the information it would need to make it. At the close I summarised the three decisions the committee had not yet made and who would own each.",
      "result": "The committee agreed a ransom decision policy and a trigger for customer communication, and both are now in its approved crisis plan. In post-exercise feedback, members rated the session 4.8 out of 5, and the chief executive asked for an annual repeat.",
      "followup": "Six months later I reviewed the crisis plan with general counsel and confirmed that both decisions had been adopted with named owners. The follow-up exercise is scheduled with a scenario designed to test the new communication trigger.",
      "sources": [
        "ev-sample-005"
      ]
    },
    "B2": {
      "situation": "A housing association discovered that an attacker had accessed a file server holding tenant records, including some sensitive personal data. The logs were incomplete, and the association's board needed to decide whether to notify the Information Commissioner's Office (ICO) and several thousand tenants. Over-notifying would cause distress and cost; under-notifying would breach its legal obligations.",
      "task": "I led the forensic investigation and was asked for an expert opinion on what data had been exposed. Two analysts on my team carried out the file system and network analysis under my direction. The notification decision belonged to the data protection officer (DPO) and the board, advised by external lawyers.",
      "action": "I directed the analysts to establish which folders the attacker had browsed, opened and copied, and I reviewed their findings before relying on them. Because the network logs covered only part of the period, I set out my opinion in three categories: data we could confirm had been accessed, data that was probably accessed based on the attacker's behaviour, and data where the evidence could not support a conclusion either way. I stated the confidence level for each and the reasons. I presented this first to the DPO and lawyers, then to the board, using a one-page summary with a simple diagram of the folders and what we knew about each. When a board member asked for a single yes or no answer, I explained why the uncertain category could not be resolved and what that meant for their decision, rather than overstating certainty.",
      "result": "The board notified the ICO within the statutory 72 hours and wrote to tenants in the confirmed and probable categories. The ICO closed its enquiry without further action, and the lawyers told me that the clear separation of confirmed and assessed findings made the decision straightforward to defend.",
      "followup": "I turned the three-category format into a standard template for data exposure opinions, which my team has used on four subsequent cases. I also recommended longer network log retention; at a follow-up three months later the association confirmed retention now covers 12 months.",
      "sources": [
        "ev-sample-015"
      ]
    },
    "B3": {
      "situation": "My incident response team had grown through referrals and recruited almost entirely from one background: computer science graduates, nearly all men. We were struggling to fill roles, and on-call work was falling on a small group who were showing signs of fatigue after a run of difficult extortion cases.",
      "task": "As team lead I was accountable for hiring into my team and for the wellbeing of the people in it. Our human resources (HR) business partner owned recruitment policy and signed off any change to it, and the head of service approved headcount.",
      "action": "I redesigned our hiring process with the HR business partner: anonymised CV screening, removal of the degree requirement, a practical triage exercise and structured interviews with a shared scoring rubric. I briefed every interviewer on avoiding bias and made sure each panel included at least one woman and one person from outside the team. When candidates asked for adjustments, I offered the exercise in written form or with extra time. Within the team, I introduced structured debriefs after high-pressure cases that cover how people are coping as well as the technical lessons. When one analyst told me privately that a case involving threats against a client's staff had affected them, I adjusted their on-call rota, arranged access to our employee assistance programme and checked in weekly, without making it public. I also raised a formal concern with the organisers of an online forensics community after repeated dismissive comments towards newcomers and women.",
      "result": "The next two hiring rounds produced shortlists with more career changers and a better gender balance than any previous round, and we hired two career changers who now work independently on routine cases. The analyst returned to the full rota after two months. The online community introduced active moderation and a channel for newcomers, and the organisers confirmed the complaints stopped.",
      "followup": "The HR business partner has since adopted the structured interview format for two other technical teams. I review anonymous feedback on the debriefs each quarter; the latest review showed every team member found them useful, and one suggested a change to timing that I made.",
      "sources": [
        "ev-sample-012"
      ]
    },
    "B4": {
      "situation": "After the ransomware incident at a mid-sized manufacturer, the board needed a final report it could act on, the insurer needed a technical account to support the claim, and the client's IT team needed detailed remediation steps. These audiences wanted very different things from the same incident.",
      "task": "I was responsible for the final report and for presenting it to the board. Four team members drafted the technical sections on host forensics, network analysis, malware and cloud; I wrote the executive summary and recommendations and was accountable for the quality of the whole report before sign-off.",
      "action": "I structured the report in layers: a two-page board briefing covering what happened, what it cost, why it happened and what the board needed to decide; a management summary; and technical appendices. I edited the technical sections for accuracy, a consistent timeline in Coordinated Universal Time (UTC), and plain English, and returned two sections to their authors where findings were stated more strongly than the evidence supported. In the board briefing I replaced attack terminology with plain descriptions of what the attacker did and why it mattered. I then presented in person to the board, which included a non-executive director with no technology background. When she asked whether the company could have prevented the attack, I answered directly, explained the unpatched device in business terms, and linked it to the investment decision in front of them.",
      "result": "The board approved the remediation budget at that meeting, including multi-factor authentication and a managed endpoint detection and response (EDR) service it had previously deferred. The insurer accepted the report without follow-up questions, and the board chair asked to use the briefing format for the company's annual risk review.",
      "followup": "I adopted the layered structure as my team's standard report template, and I now run a writing review with each consultant on their first two reports under it. In the next quarterly quality sample, none of the reviewed reports needed rework for overstated findings.",
      "sources": [
        "ev-sample-003"
      ]
    },
    "C1": {
      "situation": "In one week in early 2025 my team was handling three major incidents at once: ransomware at a logistics company, a business email compromise at a law firm, and a suspected insider case at a technology company. My team of five, plus me, could not cover all three at the required pace, and two of the clients had contractual response commitments under their retainers.",
      "task": "I was accountable for allocating people and budget across all three incidents. I had authority to call on our surge partner up to an agreed budget; any spending above that, or any change to a client commitment, needed approval from the head of service.",
      "action": "I assessed each incident by business impact, how quickly evidence could be lost, and contractual commitment. I assigned my most experienced analyst to lead the ransomware case, the most complex, took the business email compromise myself because it needed rapid client communication, and paired a junior analyst with a senior on the insider case under close review. I engaged two forensic analysts from the surge partner within our pre-approved budget, briefed them on our playbooks and evidence standards, and reviewed their first outputs myself. When the ransomware case grew, I presented the head of service with costed options for extending surge support, and he approved a further week. I ran a single daily stand-up across all three cases, tracked hours against each budget, and took people off on-call after two consecutive late nights.",
      "result": "All three clients received responses within their contractual commitments. The ransomware case finished within the extended budget, no one in the team took sick leave during or after the period, and the surge analysts' outputs passed our quality review without rework.",

function body(){ return BODIES[S.profile.body]||BODIES.other; }
function desc(f,lv){ lv=lv||S.settings.target; return f.d.all||f.d[lv]; }
function forms(){ return FORM.filter(f=>desc(f)); }
function scen(fid){ return S.scenarios[fid]||(S.scenarios[fid]={situation:'',task:'',action:'',result:'',followup:'',sources:[]}); }
function scenText(sc){ return STAR.map(x=>sc[x.k]||'').join('\n'); }
function scenWords(fid){ return words(scenText(scen(fid))); }

// ── writing checks (from licensed-body guidance) ────────────────────
const ACR_OK=new Set(['UK','US','IT','I','CEO','CFO','CTO','CIO','PDF','USB','OK','EU','TV','HR','CV','ISO','IEC','A1','A2','A3','B1','B2','B3','B4','C1','C2','C3','C4','D1','D2','D3','D4','E1','E2','E3','TLP','CLEAR','AMBER','RED','GREEN','BSides','ID','GIAC','CREST','SP','KQL']);
function checks(fid){
  const sc=scen(fid), txt=scenText(sc), w=words(txt), b=body(), out=[], lv=S.settings.target;
  if(!w) return {status:'empty',w,items:[]};
  STAR.slice(0,4).forEach(x=>{ if(!words(sc[x.k])) out.push(['err',`Add the ${x.label.toLowerCase()}.`]); });
  if(w<b.min) out.push(['err',`${w} words. ${b.bandNote}`]);
  if(b.max&&w>b.max) out.push(['adv',`${w} words, above the ${b.max}-word guide. ${b.bandNote}`]);
  const ids=[...txt.matchAll(/\b(?:\d{1,3}\.){3}\d{1,3}\b|[\w.+-]+@[\w-]+\.[\w.]+|\b[a-f0-9]{32,64}\b|\b[\w-]+\.(?:local|corp|internal|lan)\b/gi)].map(m=>m[0]);
  if(ids.length) out.push(['err',`Possible identifiers: ${[...new Set(ids)].slice(0,3).join(', ')}. Describe them by function instead.`]);
  if(/\bCVE-\d{4}-\d+/i.test(txt)) out.push(['adv','A specific CVE is named. Consider describing the class of weakness instead of exploitable detail.']);
  if(lv!=='pra'&&!words(sc.followup)) out.push(['adv',`Add follow-up. At ${LV[lv].name} it shows sustained review, assurance or adoption.`]);
  if(words(sc.task)&&!/(delegat|authori[sz]|accountab|owned|responsib|outside my|approv|sponsor|direct|sat with|remained with|belonged to)/i.test(sc.task)) out.push(['adv','Make your authority clear in the task: what you owned, what you delegated and what sat outside your authority.']);
  if(words(sc.result)&&!/(confirm|verif|retest|re-test|review|audit|exercise|measur|sampl|assur|feedback|adopt|approv|accepted|found)/i.test(sc.result)) out.push(['adv','Show how the result was verified: a retest, review, audit, exercise, decision or adoption.']);
  if(/\b(improv(ed|es|ing)|posture)\b/i.test(sc.result+' '+sc.followup)) out.push(['adv','Replace "improved" with what changed and how it was verified.']);
  const we=(txt.match(/\bwe\b|\bour team\b/gi)||[]).length; if(we>=3) out.push(['adv',`${we} uses of "we". Assessors assess you: say what you did and what others contributed.`]);
  const pas=(txt.match(/\b(was|were|been|being)\s+(\w+ed|done|made|given|taken|written|built|run|found|seen|held|sent|shown)\b/gi)||[]).length; if(pas>=4) out.push(['adv',`${pas} passive phrases. Prefer "I did" to "it was done".`]);
  const acr=[...new Set((txt.match(/\b[A-Z][A-Z0-9&]{1,6}s?\b/g)||[]).map(a=>a.replace(/s$/,'')))].filter(a=>!ACR_OK.has(a)&&!new RegExp('\\([^)]*\\b'+a+'s?\\b[^)]*\\)').test(txt)&&!new RegExp('\\b'+a+'s?\\s*\\(').test(txt));
  if(acr.length) out.push(['adv',`Explain on first use: ${acr.slice(0,6).join(', ')}${acr.length>6?'…':''}.`]);
  if(sc.sources&&sc.sources[0]){ const n=FORM.filter(f=>f.id!==fid&&(S.scenarios[f.id]?.sources||[])[0]===sc.sources[0]).length; if(n>=2) out.push(['adv',`The primary source is also primary for ${n} other sections. Assessors look for a range of scenarios.`]); }
  const err=out.some(x=>x[0]==='err');
  return {status:err?'draft':'ready',w,items:out};
}
function appStats(){ const fs=forms(); const o={n:fs.length,ready:0,draft:0,empty:0,words:0}; fs.forEach(f=>{ const c=checks(f.id); o[c.status]++; o.words+=c.w; }); return o; }

// ── persistence ─────────────────────────────────────────────────────
function serialise(){ return {app:APP_ID,schema:SCHEMA,standard:STANDARD,...(S.sample?{sample:true}:{}),savedAt:new Date().toISOString(),profile:S.profile,settings:{target:S.settings.target,scope:S.settings.scope},statements:S.statements,evidence:S.evidence,scenarios:S.scenarios,support:S.support,seq:S.seq}; }
const mig=id=>/^[A-E]\d-(Pra|Pri|Ch)\d+$/.test(id)?'IR-'+id:id;
function normalise(obj){
  if(!obj||obj.app!==APP_ID||!Array.isArray(obj.evidence)) throw new Error('This file is not an IR competence evidence progress file.');
  const n=blank(); n.sample=!!obj.sample;
  Object.assign(n.profile,obj.profile||{}); if(!n.profile.conf) n.profile.conf=DEFAULT_CONF; if(!['A','B'].includes(n.profile.route)) n.profile.route='A';
  if(obj.settings){ if(LV[obj.settings.target]) n.settings.target=obj.settings.target; if(['target','all'].includes(obj.settings.scope)) n.settings.scope=obj.settings.scope; }
  n.settings.working=S.settings.working;
  const st=obj.statements||{};
  Object.keys(st).forEach(k=>{ const v=st[k]||{}; n.statements[mig(k)]={rating:['gap','acceptable','thorough'].includes(v.rating)?v.rating:'',notes:String(v.notes||'')}; });
  let maxNo=0;
  n.evidence=obj.evidence.map((e,i)=>{ const no=Number(e.no)||i+1; maxNo=Math.max(maxNo,no); const s=k=>String(e[k]||''); return {
    id:String(e.id||('ev-'+Math.random().toString(36).slice(2,10))),no,title:s('title')||'Untitled evidence',type:s('type')||'Other',date:s('date'),role:s('role'),reference:s('reference'),scale:s('scale'),verifier:s('verifier'),
    situation:s('situation'),task:s('task'),action:s('action'),result:s('result')||s('outcome'),followup:s('followup'),
    sanitised:!!e.sanitised,links:Array.isArray(e.links)?e.links.map(x=>mig(String(x))):[],created:e.created||'',updated:e.updated||''}; });
  const sc=obj.scenarios||{};
  Object.keys(sc).forEach(k=>{ if(!FORMBY[k]) return; const v=sc[k]||{}; n.scenarios[k]={situation:String(v.situation||''),task:String(v.task||''),action:String(v.action||''),result:String(v.result||''),followup:String(v.followup||''),sources:Array.isArray(v.sources)?v.sources.map(String):[]}; });
  const sp=obj.support||{};
  Object.keys(SUP_DEFS).forEach(k=>{ n.support[k]=Array.isArray(sp[k])?sp[k].map(r=>Object.fromEntries(SUP_DEFS[k].fields.map(([f])=>[f,String((r||{})[f]||'')]))):[]; });
  n.seq=Math.max(Number(obj.seq)||0,maxNo);
  return n;
}
let workTimer=null;
let lastAuto=null, autoFail=false;
function persistWorking(){ clearTimeout(workTimer); workTimer=setTimeout(()=>{ try{ if(S.settings.working){ localStorage.setItem(WORK_KEY,JSON.stringify({...serialise(),dirty,lastSaved})); lastAuto=new Date(); autoFail=false; } else localStorage.removeItem(WORK_KEY); }catch(e){ autoFail=true; } renderSaveStatus(); },300); }
function markDirty(full){ dirty=true; persistWorking(); full?render():renderChrome(); }
function saveFile(name,data,mime){ const blob=new Blob([data],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800); }
function slug(){ return (S.profile.name||'candidate').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'candidate'; }
function exportJSON(){ saveFile(`ir-spcc-progress-${slug()}-${today()}.json`,JSON.stringify(serialise(),null,2),'application/json'); dirty=false; lastSaved=new Date().toISOString(); persistWorking(); renderChrome(); toast('Progress saved to file'); }
function pickFile(){ $('#file-in').value=''; $('#file-in').click(); }
function loadFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let n; try{ n=normalise(JSON.parse(r.result)); }catch(e){ toast(e instanceof SyntaxError?'That file is not valid JSON.':e.message,true); return; }
    const apply=()=>{ S=n; ui.open.clear(); dirty=false; lastSaved=new Date().toISOString(); persistWorking(); render(); toast(`Loaded ${f.name}`); };
    if(hasData()) confirmDlg('Replace current progress?',`Loading <b>${esc(f.name)}</b> replaces everything currently in the tool. Save your current progress first if you need it.`,'Replace',apply,true); else apply();
  };
  r.onerror=()=>toast('Could not read that file.',true); r.readAsText(f);
}
function hasData(){ return !S.sample&&(S.evidence.length||Object.keys(S.statements).length||Object.values(S.scenarios).some(sc=>words(scenText(sc)))); }
function resetAll(){
  confirmDlg('Clear all data?','This removes your profile, scenarios, ratings, notes, supporting sections and every evidence item from the tool and from this browser. Files you have already saved are not affected.','Clear everything',()=>{
    const w=S.settings.working; S=blank(); S.settings.working=w; ui.open.clear(); dirty=false; lastSaved=null;
    try{ localStorage.removeItem(WORK_KEY); }catch(e){} ui.view='dash'; render(); toast('All data cleared'); openProfile(true);
  },true);
}
function loadSample(){
  const apply=()=>{ const w=S.settings.working; S=normalise(SAMPLE); S.settings.working=w; ui.open.clear(); ui.view='dash'; dirty=false; lastSaved=null; persistWorking(); closeDlg(); render(); $('#content').scrollTop=0; toast('Loaded the worked example'); };
  if(hasData()) confirmDlg('Replace current progress with the example?','Loading the worked example replaces everything currently in the tool. Save your progress to a file first if you need it.','Load example',apply,true); else apply();
}

function renderPicker(){
  const q=($('#pk-q')?.value||'').trim().toLowerCase(), L=editCtx.links;
  const pool=scoped(); L.forEach(l=>{ if(STMT[l]&&!pool.includes(STMT[l])) pool.push(STMT[l]); });
  let h=''; FORM.forEach(f=>f.ctx.forEach(rid=>{ const r=ROW[rid];
    const ss=pool.filter(s=>s.row===rid&&(!q||s.id.toLowerCase().includes(q)||s.text.toLowerCase().includes(q)||r.topic.toLowerCase().includes(q)||f.id.toLowerCase()===q));
    if(!ss.length) return;
    h+=`<div class="pick-grp">${f.id} ${esc(f.title)} · IR ${rid} ${esc(r.topic)}</div>`+ss.map(s=>`<label class="pick"><input type="checkbox"${L.has(s.id)?' checked':''} onchange="togglePick('${s.id}',this.checked)"><span class="scode">${s.id.slice(3)}</span><span>${esc(s.text)}</span></label>`).join(''); }));
  $('#picker').innerHTML=h||'<div class="empty" style="padding:14px">No statements match.</div>';
  $('#pick-n').textContent=`${L.size} statement${L.size===1?'':'s'} selected`;
}
function togglePick(id,on){ on?editCtx.links.add(id):editCtx.links.delete(id); onFormChange(); $('#pick-n').textContent=`${editCtx.links.size} statement${editCtx.links.size===1?'':'s'} selected`; }
function saveEv(){
  const v=id=>$('#'+id).value.trim(), title=v('ev-title');
  if(!title){ const h=$('#ev-err'); h.textContent='Add a title so you can find this item later.'; h.classList.add('err-hint'); $('#ev-title').focus(); return; }
  const now=new Date().toISOString();
  const data={title,type:v('ev-type'),role:v('ev-role'),date:v('ev-date'),reference:v('ev-ref'),scale:v('ev-scale'),verifier:v('ev-ver'),sanitised:$('#ev-san').checked,links:[...editCtx.links],updated:now};
  STAR.forEach(x=>data[x.k]=$('#ev-'+x.k).value.trim());
  let e; if(editCtx.id){ e=evById(editCtx.id); Object.assign(e,data); } else { S.seq++; e={id:'ev-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:S.seq,created:now,...data}; S.evidence.push(e); }
  clearDraft(); closeDlg(); markDirty(true); toast(`${editCtx.id?'Saved':'Added'} ${evRef(e)} · linked to ${e.links.length} statement${e.links.length===1?'':'s'}`);
}

function toggleLx(eid){ const e=evById(eid); if(!e) return; e.links.includes(lxStmt)?e.links=e.links.filter(l=>l!==lxStmt):e.links.push(lxStmt); dirty=true; persistWorking(); renderChrome(); renderLx(); }

function openHelp(){
  openDlg(`<h3>Using the application workbook</h3>
    <p class="small-muted" style="font-size:12.5px;line-height:1.6">The workbook has two layers, matching how assessment works.</p>
    <div class="help-callout"><span>①</span><div><strong>Competence evidence (what you submit).</strong> The application form asks for one scenario for each SPCC competence section, A1 to E3, at the level you're applying for. Write each in STAR form (Situation, Task, Action, Result) with follow-up. Live checks flag missing parts, word count against your licensed body's guidance, "we" and passive phrasing, unexplained acronyms, unverified "improved" claims, and possible identifiers. Copy each section into the online form when ready.</div></div>
    <div class="help-callout" style="background:var(--accent-soft);border-color:var(--accent-line)"><span>②</span><div><strong>Interview readiness (how you'll be questioned).</strong> Under each section sits the Incident Response contextualisation, which interviewers use as the basis for questioning and challenge. Link evidence, rate yourself, and keep interview notes against each statement. The contextualisation expects thorough knowledge in at least 80% of competences and an acceptable level in the rest; the dashboard applies that per statement as a working guide.</div></div>
    <div class="modal-sec">Self-rating</div>
    <table class="scale-table"><tr><th>Rating</th><th>Meaning</th></tr>
      <tr><td><span class="chip chip-ok">Thorough</span></td><td>You can show thorough and detailed knowledge, backed by evidence, and defend it under questioning.</td></tr>
      <tr><td><span class="chip chip-warn">Acceptable</span></td><td>You meet the statement at an acceptable but lower level of understanding.</td></tr>
      <tr><td><span class="chip chip-bad">Gap</span></td><td>You can't yet evidence this. Plan the work, training or experience to close it.</td></tr></table>
    <div class="modal-sec">Mapping</div>
    <p style="font-size:12px;line-height:1.65;color:var(--text2)">The form's 18 sections and the contextualisation's 19 rows don't line up one to one. For example, the form's D2 to D4 (codes, law, standards) correspond to contextualisation rows E1 to E3. The mapping shown under each section is this tool's interpretation; the structural checks test form, not quality, and your assessor makes the judgement.</p>
    <div class="modal-sec">Saving and exporting</div>
    <ul class="help-list">
      <li><strong>Save progress</strong> downloads a .json file with everything; <strong>Load progress</strong> restores it, including files from the earlier version of this tool.</li>
      <li><strong>Application .html</strong> lays out your draft in form order: details, education, career, papers, the 18 STAR sections, referees and confidentiality statement. Print it to PDF if needed.</li>

      <li><strong>Evidence .csv</strong> has one row per statement and evidence link.</li>

    <p class="small-muted" style="font-size:11.5px;line-height:1.55">Runs entirely in your browser and makes no network requests. Sources: The Cyber Scheme application guide and reference form, CIISec candidate guidance (June 2025), and the UKCSC Incident Response contextualisation v2.</p>

}

function preflight(fn){
  const u=S.evidence.filter(e=>!e.sanitised), idf=forms().filter(f=>checks(f.id).items.some(x=>x[1].startsWith('Possible identifiers')));
  if(!u.length&&!idf.length) return fn();
  const parts=[]; if(u.length) parts.push(`${u.length} evidence item${u.length===1?' isn\'t':'s aren\'t'} marked sanitised (${u.slice(0,6).map(evRef).join(', ')}${u.length>6?'…':''})`); if(idf.length) parts.push(`section${idf.length===1?'':'s'} ${idf.map(f=>f.id).join(', ')} may contain identifiers`);
  confirmDlg('Check before sharing',`${parts.join(', and ')}. Remove client names, hostnames, IPs and other identifiers before you share this export.`,'Export anyway',fn,false);
}
