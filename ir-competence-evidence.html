  const summary=FORM.map(f=>{ const cs=stats(scoped(s=>ROWFORM[s.row]===f.id)); return cs.n?`<tr><td><b>${f.id}</b> ${esc(f.title)}</td><td>${f.ctx.map(r=>'IR '+r).join(', ')}</td><td>${cs.ev}/${cs.n}</td><td>${cs.thorough}</td><td>${cs.acceptable}</td><td>${cs.gap}</td><td>${cs.unrated}</td></tr>`:''; }).join('');
  const bodyH=FORM.map(f=>{ const ss=scoped(s=>ROWFORM[s.row]===f.id); if(!ss.length) return '';
    return `<h2>${f.id} ${esc(f.title)}</h2>`+f.ctx.map(rid=>{ const rs=ss.filter(s=>s.row===rid); if(!rs.length) return ''; return `<h3>IR ${rid} ${esc(ROW[rid].topic)}</h3>`+rs.map(s=>{ const evs=evFor(s.id), r=rating(s.id);
      return `<div class="st"><div class="sh"><span class="code">${s.id}</span>${lv.length>1?`<span class="tag">${LV[s.lvl].name}</span>`:''}<span class="pill ${rc[r]}">${RLABEL[r]}</span></div><p class="stx">${esc(s.text)}</p>
        ${evs.length?`<ul class="evl">${evs.map(e=>`<li><a href="#${e.id}"><b>${evRef(e)}</b></a> ${esc(e.title)}</li>`).join('')}</ul>`:'<p class="none">No evidence linked.</p>'}${note(s.id)?`<div class="notes"><b>Notes.</b> ${nl(note(s.id))}</div>`:''}</div>`; }).join(''); }).join(''); }).join('');
  const appx=[...S.evidence].sort((a,b)=>a.no-b.no).map(e=>`<div class="ev" id="${e.id}"><h3>${evRef(e)} ${esc(e.title)}</h3><p class="meta">${esc(e.type)}${e.role?' · Role: '+esc(e.role):''}${e.date?' · '+esc(e.date):''}${e.reference?' · Ref: '+esc(e.reference):''} · ${e.sanitised?'Sanitised':'<b class="bad">Not marked sanitised</b>'}</p>
    ${e.scale?`<p><b>Scale.</b> ${nl(e.scale)}</p>`:''}${STAR.filter(x=>e[x.k]).map(x=>`<p><b>${x.label}.</b> ${nl(e[x.k])}</p>`).join('')}${e.verifier?`<p><b>Can be verified by.</b> ${nl(e.verifier)}</p>`:''}<p class="meta">Statements: ${e.links.length?e.links.map(esc).join(', '):'none'}</p></div>`).join('');
  const html=docHead(`Interview pack${p.name?' – '+p.name:''}`)+`<h1>Interview readiness pack</h1><p class="sub">Incident Response contextualisation · ${t.name} (${t.abbr}) · ${esc(p.name)||'candidate'} · exported ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>
<dl><dt>Statements in scope</dt><dd>${st.n} (${lv.map(k=>LV[k].name).join(', ')})</dd><dt>Evidenced</dt><dd>${st.ev} of ${st.n}</dd><dt>Rated thorough</dt><dd>${pct(st.thorough,st.n)}% (80/20 profile ${rd.ok?'met':'not yet met'})</dd><dt>Evidence items</dt><dd>${S.evidence.length}</dd></dl>
<h2 class="first">Summary by application section</h2><table><tr><th>Section</th><th>Contextualisation</th><th>Evidenced</th><th>Thorough</th><th>Acceptable</th><th>Gap</th><th>Not rated</th></tr>${summary}</table>${bodyH}<h2>Evidence appendix</h2>${appx||'<p class="mut">No evidence recorded.</p>'}</body></html>`;
  saveFile(`ir-spcc-interview-pack-${slug()}-${today()}.html`,html,'text/html'); toast('Interview pack exported');
}); }
function exportCSV(){ preflight(()=>{
  const q=v=>{ v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const head=['Application section','Contextualisation row','Row topic','Level','Statement ID','Statement','Self-rating','Interview notes','Evidence ref','Evidence title','Type','Date','Role','Scale','Situation','Task','Action','Result','Follow-up','Verifier','Reference','Sanitised'];
  const lines=[head.map(q).join(',')];
  scoped().forEach(s=>{ const f=formOf(s), base=[`${f.id} ${f.title}`,s.row,ROW[s.row].topic,LV[s.lvl].name,s.id,s.text,RLABEL[rating(s.id)],note(s.id)], evs=evFor(s.id);
    if(!evs.length) lines.push([...base,...Array(14).fill('')].map(q).join(','));
    evs.forEach(e=>lines.push([...base,evRef(e),e.title,e.type,e.date,e.role,e.scale,e.situation,e.task,e.action,e.result,e.followup,e.verifier,e.reference,e.sanitised?'Yes':'No'].map(q).join(','))); });
  saveFile(`ir-spcc-evidence-${slug()}-${today()}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv'); toast('Evidence table exported');
}); }

// ── toast / theme / init ────────────────────────────────────────────
function toast(msg,isErr){ const ex=document.getElementById('toast'); if(ex) ex.remove(); const t=document.createElement('div'); t.id='toast'; t.className='toast'+(isErr?' err':''); t.setAttribute('role','status'); t.innerHTML='<span class="toast-dot"></span><span></span>'; t.lastChild.textContent=msg; document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },isErr?4000:2600); }
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(p){ document.documentElement.setAttribute('data-theme',p==='system'?(mq&&mq.matches?'dark':'light'):p); }
function setTheme(v){ const sel=$('#theme-select'); if(sel&&sel.value!==v) sel.value=v; try{ localStorage.setItem(THEME_KEY,v); }catch(e){} applyTheme(v); }
(function init(){
  let v='light'; try{ v=localStorage.getItem(THEME_KEY)||'light'; }catch(e){}
  $('#theme-select').value=v; applyTheme(v);
  if(mq&&mq.addEventListener) mq.addEventListener('change',()=>{ if($('#theme-select').value==='system') applyTheme('system'); });
  let restored=false;
  try{ const raw=localStorage.getItem(WORK_KEY); if(raw){ const o=JSON.parse(raw); S=normalise(o); S.settings.working=true; dirty=!!o.dirty; lastSaved=o.lastSaved||null; restored=true; } }catch(e){}
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') requestClose(); });
  window.addEventListener('beforeunload',e=>{ if((dirty&&!S.settings.working)||(formDirty&&(!S.settings.working||dlgKind!=='ev'))){ e.preventDefault(); e.returnValue=''; } });
  render();
  if(restored) toast('Restored your working copy from this browser'); else openProfile(true);
})();

</script>
